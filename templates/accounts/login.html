{% extends 'base.html' %}{% block title %}Sign in — NOVA MARKET{% endblock %}{% block content %}<main class="auth-page"><div class="auth-card"><span class="eyebrow">Welcome back</span><h1>Sign in to<br><em>your account.</em></h1><form method="post" class="auth-form">{% csrf_token %}<input type="hidden" name="next" value="{{ next }}">{{ form.non_field_errors }}{% for field in form %}<label>{{ field.label }}{{ field }}{% for error in field.errors %}<small>{{ error }}</small>{% endfor %}</label>{% endfor %}<button class="button button-dark" type="submit">Sign in <span>→</span></button></form><p>New to NOVA MARKET? <a href="{% url 'accounts:register' %}">Create an account</a></p></div></main>{% endblock %}
