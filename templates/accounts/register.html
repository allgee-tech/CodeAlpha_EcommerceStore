{% extends 'base.html' %}{% block title %}Create account — NOVA MARKET{% endblock %}{% block content %}<main class="auth-page"><div class="auth-card"><span class="eyebrow">Join the market</span><h1>Make room for<br><em>good things.</em></h1><form method="post" class="auth-form">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label>{{ field.label }}{{ field }}{% if field.help_text %}<small>{{ field.help_text|safe }}</small>{% endif %}{% for error in field.errors %}<small>{{ error }}</small>{% endfor %}</label>{% endfor %}<button class="button button-dark" type="submit">Create account <span>→</span></button></form><p>Already have an account? <a href="{% url 'accounts:login' %}">Sign in</a></p></div></main>{% endblock %}
